# The site's stack, shared by every environment.
# - Staging and production: Coolify deploys this file (Docker Compose build pack, "/infra/compose.yaml").
#   It pulls the image GitHub Actions built: IMAGE_TAG=staging or IMAGE_TAG=production, set in Coolify
#   with the other variables below. The domain is set on the `web` service in Coolify, port 3000.
# - Local: add compose.local.yaml, which builds the image from the working copy instead.
# See docs/deployment.md.
name: atlas-kine-sport

services:
  web:
    image: ghcr.io/eldenn/atlas-kine-sport:${IMAGE_TAG:-local}
    # Tags like :staging move on every deployment: always fetch the current one.
    pull_policy: always
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      # Contact form (Hostinger Mail API). Read by the server only, never sent to the browser.
      HOSTINGER_MAIL_API_TOKEN: ${HOSTINGER_MAIL_API_TOKEN:-}
      HOSTINGER_MAILBOX_ID: ${HOSTINGER_MAILBOX_ID:-}
      CONTACT_TO: ${CONTACT_TO:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/robots.txt').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
