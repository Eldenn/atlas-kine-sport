# Puts an older release back online: points the :production image at an already-built release
# (v0.2.0) and asks Coolify to redeploy production. Nothing is rebuilt.
# Off until the repository variable PRODUCTION_DEPLOY_ENABLED is "true".
name: Roll back production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release to put back online (for example v0.2.0)
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/eldenn/atlas-kine-sport

jobs:
  rollback:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://atlas-kine-sport.fr
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point :production at the release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Expected a release like v0.2.0"; exit 1; }
          docker buildx imagetools create --tag "$IMAGE:production" "$IMAGE:$VERSION"
          echo "Production image is now $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy on Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}
        run: |
          curl --fail --silent --show-error --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
