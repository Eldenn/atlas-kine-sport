# Releases with Changesets, with nothing to run by hand. On every push to main:
# - the push is the merged release PR ("chore(release): v…") → tag v<version>, publish a GitHub
#   release, build the production image (ghcr.io/eldenn/atlas-kine-sport:v<version>), then point
#   :production at it and ask Coolify to redeploy production. Those last two steps are off until the
#   repository variable PRODUCTION_DEPLOY_ENABLED is "true".
# - otherwise, if feat / fix / perf commits landed since the last release → one changeset per commit
#   (scripts/release/changesets-from-commits.mjs, from the squash-merged PR title), then
#   (re)build the release PR on `chore/release`: version bump + CHANGELOG.md. Nothing goes live.
# Staging is handled by deploy-staging.yml. Secrets: COOLIFY_TOKEN, COOLIFY_PRODUCTION_WEBHOOK.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BRANCH: chore/release
      IMAGE: ghcr.io/eldenn/atlas-kine-sport
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: What this push is
        id: state
        run: |
          version=$(node -p "require('./package.json').version")
          subject=$(git log -1 --format=%s)
          if [[ "$subject" == "chore(release): v"* ]] && ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            mode=release
          else
            node scripts/release/changesets-from-commits.mjs
            # Generated changesets plus any hand-written one.
            if [ "$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)" -gt 0 ]; then
              mode=prepare
            else
              mode=none
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Version $version: $mode"

      - name: Open or update the release PR
        if: steps.state.outputs.mode == 'prepare'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$RELEASE_BRANCH"
          pnpm changeset version
          pnpm prettier --write CHANGELOG.md package.json
          version=$(node -p "require('./package.json').version")
          git add -A
          git commit -m "chore(release): v$version"
          git push --force origin "$RELEASE_BRANCH"

          notes=$(awk -v v="$version" '$0 == "## " v {on=1; next} /^## / && on {exit} on' CHANGELOG.md)
          body=$(printf 'Merging this PR releases **v%s**: tag, GitHub release and production deployment.\n\n%s\n' "$version" "$notes")
          number=$(gh pr list --head "$RELEASE_BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "chore(release): v$version" --body "$body"
          else
            gh pr create --base main --head "$RELEASE_BRANCH" --title "chore(release): v$version" --body "$body"
          fi

      - name: Tag and publish the release
        if: steps.state.outputs.mode == 'release'
        env:
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          notes=$(awk -v v="$VERSION" '$0 == "## " v {on=1; next} /^## / && on {exit} on' CHANGELOG.md)
          gh release create "v$VERSION" --title "v$VERSION" --notes "${notes:-Release v$VERSION}"

      - uses: docker/setup-buildx-action@v3
        if: steps.state.outputs.mode == 'release'

      - uses: docker/login-action@v3
        if: steps.state.outputs.mode == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the production image
        if: steps.state.outputs.mode == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:v${{ steps.state.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to production
        if: steps.state.outputs.mode == 'release'
        env:
          VERSION: ${{ steps.state.outputs.version }}
          ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "::notice::v$VERSION tagged and built; production deployment is switched off (PRODUCTION_DEPLOY_ENABLED)."
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:production" "$IMAGE:v$VERSION"
          curl --fail --silent --show-error --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
          echo "v$VERSION is going live" >> "$GITHUB_STEP_SUMMARY"
